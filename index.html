<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sentence Matching Exercise</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: #1f3c88;
    }

    .instructions {
      background: #eef4ff;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      line-height: 1.6;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }

    th,
    td {
      border: 1px solid #d6dce5;
      padding: 12px;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #1f3c88;
      color: white;
      font-weight: 600;
    }

    tbody tr:nth-child(even) {
      background: #f8faff;
    }

    select {
      width: 100%;
      padding: 10px;
      border: 1px solid #b9c2d0;
      border-radius: 6px;
      background: white;
      font-size: 15px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: #1f3c88;
      box-shadow: 0 0 0 2px rgba(31, 60, 136, 0.15);
    }

    .button-area {
      text-align: center;
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 7px;
      cursor: pointer;
      margin: 5px;
    }

    #submitBtn {
      background: #1f3c88;
      color: white;
    }

    #submitBtn:hover {
      background: #162d68;
    }

    #resetBtn {
      background: #e5e7eb;
      color: #222;
    }

    #resetBtn:hover {
      background: #d1d5db;
    }

    #result {
      margin-top: 25px;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }

    .score {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .correct {
      background: #e8f7ed;
      border-left: 5px solid #22a06b;
    }

    .incorrect {
      background: #fff0f0;
      border-left: 5px solid #d93025;
    }

    .result-row {
      padding: 12px;
      margin: 8px 0;
      border-radius: 6px;
    }

    .answer-label {
      font-weight: bold;
    }

    .correct-answer {
      color: #b42318;
      margin-top: 5px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      .container {
        padding: 15px;
      }

      h1 {
        font-size: 24px;
      }

      th,
      td {
        padding: 8px;
      }

      select {
        font-size: 14px;
        padding: 8px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Match the Sentence Parts</h1>

  <div class="instructions">
    <strong>Instructions:</strong>
    Choose the correct option from Column 2 and Column 3
    to make five meaningful sentences.
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th style="width: 35%;">Column 1</th>
          <th style="width: 32.5%;">Column 2</th>
          <th style="width: 32.5%;">Column 3</th>
        </tr>
      </thead>

      <tbody id="questionTable">
        <!-- JavaScript will generate the rows here -->
      </tbody>
    </table>
  </div>

  <div class="button-area">
    <button id="submitBtn" onclick="checkAnswers()">
      Submit Answers
    </button>

    <button id="resetBtn" onclick="resetExercise()">
      Reset
    </button>
  </div>

  <div id="result"></div>

</div>


<script>

/*
===========================================================
  EXERCISE DATA
===========================================================

  You only need to edit this section.

  "left"   = Column 1
  "middle" = correct answer from Column 2
  "right"  = correct answer from Column 3

  The options for Column 2 and Column 3 are automatically
  generated from all the answers below.

===========================================================
*/

const questions = [

  {
    left: "If you work hard,",
    middle: "you will",
    right: "succeed in life."
  },

  {
    left: "Although it was raining,",
    middle: "we decided to",
    right: "go outside."
  },

  {
    left: "She studied hard because",
    middle: "she wanted to",
    right: "pass the examination."
  },

  {
    left: "When I reached the station,",
    middle: "the train had",
    right: "already left."
  },

  {
    left: "If you eat too much junk food,",
    middle: "you may",
    right: "become unhealthy."
  }

];


/*
===========================================================
  GENERATE OPTIONS AUTOMATICALLY
===========================================================

  We collect all "middle" and "right" answers.

  Therefore, you don't need to write the dropdown
  options separately.
===========================================================
*/

const middleOptions = [...new Set(
  questions.map(question => question.middle)
)];

const rightOptions = [...new Set(
  questions.map(question => question.right)
)];


/*
===========================================================
  SHUFFLE FUNCTION
===========================================================

  This makes the dropdown options appear in random order.
===========================================================
*/

function shuffle(array) {

  const shuffled = [...array];

  for (let i = shuffled.length - 1; i > 0; i--) {

    const j = Math.floor(Math.random() * (i + 1));

    [shuffled[i], shuffled[j]] =
      [shuffled[j], shuffled[i]];
  }

  return shuffled;
}


/*
===========================================================
  CREATE DROPDOWN
===========================================================
*/

function createDropdown(options, column, rowIndex) {

  const select = document.createElement("select");

  select.dataset.column = column;
  select.dataset.row = rowIndex;

  // Default option
  const defaultOption = document.createElement("option");

  defaultOption.value = "";
  defaultOption.textContent = "— Select —";
  defaultOption.disabled = true;
  defaultOption.selected = true;

  select.appendChild(defaultOption);


  // Add options
  shuffle(options).forEach(optionText => {

    const option = document.createElement("option");

    option.value = optionText;
    option.textContent = optionText;

    select.appendChild(option);

  });

  return select;
}


/*
===========================================================
  GENERATE TABLE
===========================================================
*/

function generateTable() {

  const tableBody =
    document.getElementById("questionTable");

  tableBody.innerHTML = "";


  questions.forEach((question, index) => {

    const row = document.createElement("tr");


    // Column 1
    const leftCell = document.createElement("td");

    leftCell.textContent = question.left;

    row.appendChild(leftCell);


    // Column 2
    const middleCell = document.createElement("td");

    const middleDropdown =
      createDropdown(
        middleOptions,
        "middle",
        index
      );

    middleCell.appendChild(middleDropdown);

    row.appendChild(middleCell);


    // Column 3
    const rightCell = document.createElement("td");

    const rightDropdown =
      createDropdown(
        rightOptions,
        "right",
        index
      );

    rightCell.appendChild(rightDropdown);

    row.appendChild(rightCell);


    tableBody.appendChild(row);

  });

}


/*
===========================================================
  CHECK ANSWERS
===========================================================
*/

function checkAnswers() {

  let score = 0;

  const resultDiv =
    document.getElementById("result");

  resultDiv.innerHTML = "";

  resultDiv.style.display = "block";


  questions.forEach((question, index) => {

    const middleSelect =
      document.querySelector(
        `select[data-column="middle"][data-row="${index}"]`
      );

    const rightSelect =
      document.querySelector(
        `select[data-column="right"][data-row="${index}"]`
      );


    const selectedMiddle =
      middleSelect.value;

    const selectedRight =
      rightSelect.value;


    const isCorrect =
      selectedMiddle === question.middle &&
      selectedRight === question.right;


    const resultRow =
      document.createElement("div");

    resultRow.classList.add("result-row");


    if (isCorrect) {

      score++;

      resultRow.classList.add("correct");

      resultRow.innerHTML = `
        <strong>Question ${index + 1}: ✓ Correct</strong>
      `;

    } else {

      resultRow.classList.add("incorrect");

      resultRow.innerHTML = `
        <strong>Question ${index + 1}: ✗ Incorrect</strong>

        <div class="correct-answer">
          <span class="answer-label">
            Correct answer:
          </span>
          ${question.left}
          ${question.middle}
          ${question.right}
        </div>
      `;

    }


    resultDiv.appendChild(resultRow);

  });


  // Score
  const scoreDiv =
    document.createElement("div");

  scoreDiv.classList.add("score");

  scoreDiv.textContent =
    `Your Score: ${score} / ${questions.length}`;

  resultDiv.insertBefore(
    scoreDiv,
    resultDiv.firstChild
  );


  // Scroll to result
  resultDiv.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/*
===========================================================
  RESET
===========================================================
*/

function resetExercise() {

  generateTable();

  const resultDiv =
    document.getElementById("result");

  resultDiv.innerHTML = "";

  resultDiv.style.display = "none";

}


/*
===========================================================
  START THE EXERCISE
===========================================================
*/

generateTable();

</script>

</body>
</html>
